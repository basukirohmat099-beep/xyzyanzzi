# =============================================================================
#  WEB2APK.YML — Konversi URL Website menjadi APK (WebView wrapper)
#  Dipicu oleh bot lewat: github.js → triggerWeb2ApkWorkflow()
#  Input: web_url, app_name, icon_url
# =============================================================================

name: Web2APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL website"
        required: true
        type: string
      app_name:
        description: "Nama aplikasi"
        required: true
        type: string
      icon_url:
        description: "URL icon (opsional)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Web2APK - ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Info versi
        run: |
          flutter --version
          java -version

      # ─── BUAT PROJECT FLUTTER WEBVIEW ─────────────────────────────────────
      - name: Buat project Flutter WebView
        run: |
          set -e
          flutter create --org com.web2apk --project-name web2apk_app web2apk_app
          cd web2apk_app

          cat > pubspec.yaml <<'EOF'
          name: web2apk_app
          description: Web2APK wrapper
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.7.0
          flutter:
            uses-material-design: true
          EOF

          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'APP_NAME_PLACEHOLDER',
                debugShowCheckedModeBanner: false,
                home: const WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController _c;

            @override
            void initState() {
              super.initState();
              _c = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0x00000000))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (int progress) {},
                    onPageStarted: (String url) {},
                    onPageFinished: (String url) {},
                    onWebResourceError: (WebResourceError error) {},
                  ),
                )
                ..loadRequest(Uri.parse('WEB_URL_PLACEHOLDER'));
            }

            @override
            Widget build(BuildContext context) => Scaffold(body: WebViewWidget(controller: _c));
          }
          EOF

          sed -i "s|APP_NAME_PLACEHOLDER|${{ inputs.app_name }}|g" lib/main.dart
          sed -i "s|WEB_URL_PLACEHOLDER|${{ inputs.web_url }}|g" lib/main.dart

          flutter pub get

      # ─── SET NAMA APLIKASI ANDROID ─────────────────────────────────────────
      - name: Set nama aplikasi Android
        run: |
          cd web2apk_app
          sed -i 's/android:label=".*"/android:label="${{ inputs.app_name }}"/' android/app/src/main/AndroidManifest.xml || true

      # ─── DOWNLOAD ICON (JIKA ADA) ─────────────────────────────────────────
      - name: Download icon (jika ada)
        if: inputs.icon_url != ''
        run: |
          set +e
          curl -L --fail -o icon.png "${{ inputs.icon_url }}"
          if [ -f icon.png ]; then
            cd web2apk_app
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp ../icon.png android/app/src/main/res/$d/ic_launcher.png 2>/dev/null || true
            done
          fi

      # ─── BUILD APK ────────────────────────────────────────────────────────
      - name: Build APK
        working-directory: web2apk_app
        timeout-minutes: 45
        run: flutter build apk --release

      # ─── UPLOAD ARTIFACT ──────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-${{ github.run_id }}
          path: web2apk_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Ringkasan akhir
        if: always()
        run: |
          echo "🌐 Web URL : ${{ inputs.web_url }}"
          echo "📱 App name: ${{ inputs.app_name }}"
          echo "✅ Status  : ${{ job.status }}"
